<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mesa de Acreditación Offline</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Librería universal de escaneo QR (queda cacheada para offline) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 14px;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background-color: var(--bg);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      padding: 24px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-self: center;
    }
    .header { text-align: center; }
    .header h1 { margin: 0; font-size: 1.25rem; font-weight: 700; word-break: break-word; }
    .badge-offline {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 10px;
      border-radius: 9999px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(15, 23, 42, 0.6);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      text-align: center;
    }
    .metric-val {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
      transition: color 0.2s;
    }
    .metric-val.bump { color: #93c5fd; }
    .metric-label { font-size: 0.72rem; font-weight: 500; color: var(--text-muted); text-transform: uppercase; }
    .ultimo-registro {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      min-height: 1.2em;
    }

    /* Switch de modo */
    .mode-switch-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }
    .mode-btn {
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      background: transparent;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .mode-btn.active-in { background: var(--success); color: #fff; }
    .mode-btn.active-out { background: var(--danger); color: #fff; }

    /* Visor Cámara */
    #reader-container {
      display: none;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--card-border);
    }
    #reader { width: 100%; }

    .input-dni {
      width: 100%;
      padding: 14px;
      font-size: 1.4rem;
      text-align: center;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      outline: none;
      letter-spacing: 2px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      transition: border-color 0.15s;
    }
    .input-dni::placeholder {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .input-dni:focus { border-color: var(--primary); }
    .input-dni.shake { animation: shake 0.3s; border-color: var(--danger); }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      padding: 15px;
      min-height: 52px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, opacity 0.15s;
      user-select: none;
    }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn-in { background-color: var(--success); }
    .btn-out { background-color: var(--danger); }
    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    
    #resultado {
      padding: 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      display: none;
      text-align: center;
      line-height: 1.4;
      animation: fadeIn 0.2s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ok { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); display: block !important; }
    .alerta { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); display: block !important; }
    .error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); display: block !important; }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
      padding-top: 14px;
      border-top: 1px solid var(--card-border);
    }
    .btn-tool {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .btn-tool:hover { background: rgba(15, 23, 42, 0.9); color: var(--text-main); }
    .btn-tool svg { width: 15px; height: 15px; }

    /* Modal Registro en Puerta */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 400px;
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal-card h3 { margin: 0 0 6px 0; font-size: 1.15rem; color: #fbbf24; }
    .modal-card p { margin: 0 0 14px 0; font-size: 0.82rem; color: var(--text-muted); line-height: 1.4; }
    .form-group { margin-bottom: 11px; }
    .form-group label { display: block; font-size: 0.73rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
    .modal-input, .modal-select {
      width: 100%;
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      outline: none;
      font-size: 0.9rem;
    }
    .modal-input:focus, .modal-select:focus { border-color: var(--primary); }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .btn-modal-cancel { background: transparent; border: 1px solid var(--card-border); color: var(--text-muted); }
    .btn-modal-confirm { background: var(--success); color: #fff; }

    @media (prefers-reduced-motion: reduce) {
      #resultado, .metric-val, .input-dni.shake { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 id="titulo-evento">Mesa de Acreditación</h1>
      <span class="badge-offline" id="subtitulo-evento">⚡ Sin padrón cargado</span>
    </div>

    <div class="metrics-grid">
      <div><div class="metric-val" id="m-inscriptos">0</div><div class="metric-label">Inscriptos</div></div>
      <div><div class="metric-val" id="m-presentes">0</div><div class="metric-label">En Sala</div></div>
      <div><div class="metric-val" id="m-salidas">0</div><div class="metric-label">Completados</div></div>
    </div>
    <div class="ultimo-registro" id="ultimo-registro"></div>

    <!-- Toggle de Modo Activo -->
    <div class="mode-switch-container">
      <button type="button" class="mode-btn active-in" id="mode-in" onclick="cambiarModo('ENTRADA')">
        🟢 Modo Entrada
      </button>
      <button type="button" class="mode-btn" id="mode-out" onclick="cambiarModo('SALIDA')">
        🔴 Modo Salida
      </button>
    </div>

    <!-- Visor de Escáner Continuo -->
    <div id="reader-container">
      <div id="reader"></div>
    </div>

    <input
      type="tel"
      id="dni-input"
      class="input-dni"
      placeholder="INGRESAR DNI"
      inputmode="numeric"
      maxlength="8"
      autocomplete="off"
      autofocus
      aria-label="Número de DNI"
      oninput="this.value = this.value.replace(/\D/g, '').slice(0, 8)"
    >

    <div class="btn-grid">
      <button type="button" class="btn btn-in" id="btn-entrada" onclick="procesar('ENTRADA')" aria-label="Registrar entrada">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        <span class="btn-label">Entrada</span>
      </button>
      <button type="button" class="btn btn-out" id="btn-salida" onclick="procesar('SALIDA')" aria-label="Registrar salida">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="btn-label">Salida</span>
      </button>
    </div>

    <div id="resultado" role="status" aria-live="polite"></div>

    <div class="toolbar" style="grid-template-columns: 1fr; margin-top: 2px;">
      <button type="button" class="btn-tool" id="btn-toggle-cam" onclick="toggleCamara()" style="color: #60a5fa;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span id="btn-toggle-cam-text">Activar Cámara QR</span>
      </button>
    </div>

    <div class="toolbar">
      <input type="file" id="input-csv-padron" accept=".csv" style="display: none;" onchange="cargarPadronCsv(event)">
      <button type="button" class="btn-tool" onclick="document.getElementById('input-csv-padron').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Cargar Padrón
      </button>
      <button type="button" class="btn-tool" onclick="exportarCsvAsistencia()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Exportar CSV
      </button>
    </div>
    <div class="toolbar" style="grid-template-columns: 1fr; border-top: none; padding-top: 0; margin-top: 0;">
      <button type="button" class="btn-tool" onclick="confirmarNuevoEvento()" style="color: #fbbf24;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><polyline points="3 3 3 8 8 8"/></svg>
        Nuevo Evento (borra los datos de este dispositivo)
      </button>
    </div>
  </div>

  <!-- Modal para inscribir asistentes en puerta -->
  <div class="modal-backdrop" id="modal-nuevo">
    <div class="modal-card">
      <h3>DNI no empadronado</h3>
      <p>Completá los datos del asistente para ingresarlo directamente en la sala:</p>
      <div class="form-group">
        <label>DNI</label>
        <input type="text" id="nuevo-dni" class="modal-input" readonly>
      </div>
      <div class="form-group">
        <label>Nombre completo (Nombre y Apellido)</label>
        <input type="text" id="nuevo-nombre" class="modal-input" placeholder="Ej: Juan Pérez" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" id="nuevo-email" class="modal-input" placeholder="juan@ejemplo.com" autocomplete="off">
      </div>
      <div class="form-group">
        <label>¿Necesita constancia para trabajo/estudio?</label>
        <select id="nuevo-constancia" class="modal-select">
          <option value="No">No</option>
          <option value="Sí">Sí</option>
        </select>
      </div>
      <div class="form-group">
        <label>¿Desea recibir invitaciones a futuros eventos?</label>
        <select id="nuevo-invitaciones" class="modal-select">
          <option value="Sí">Sí</option>
          <option value="No">No</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-tool btn-modal-cancel" onclick="cerrarModal()">Cancelar</button>
        <button type="button" class="btn btn-in btn-modal-confirm" onclick="confirmarRegistroPuerta()">Ingresar</button>
      </div>
    </div>
  </div>

  <script>
    // Registro de Service Worker para funcionamiento 100% Offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    let nombreEventoActivo = localStorage.getItem("fcad_evento_nombre") || "Evento General";
    let STORAGE_KEY = localStorage.getItem("fcad_evento_key") || "fcad_acreditacion_db_v2::evento_general";
    let modoActivo = "ENTRADA";

    const box = document.getElementById("resultado");
    const input = document.getElementById("dni-input");
    const ultimoRegistro = document.getElementById("ultimo-registro");
    const modalNuevo = document.getElementById("modal-nuevo");
    const tituloEvento = document.getElementById("titulo-evento");
    const subtituloEvento = document.getElementById("subtitulo-evento");
    const readerContainer = document.getElementById("reader-container");

    let audioCtx = null;
    let padron = {};
    let html5QrCode = null;
    let camaraActiva = false;

    // Cooldown inteligente para escaneo continuo
    let ultimoDniLeido = "";
    let tiempoUltimaLectura = 0;
    const COOLDOWN_MS = 6000;

    function cambiarModo(nuevoModo) {
      modoActivo = nuevoModo;
      const btnIn = document.getElementById("mode-in");
      const btnOut = document.getElementById("mode-out");
      if (modoActivo === "ENTRADA") {
        btnIn.className = "mode-btn active-in";
        btnOut.className = "mode-btn";
      } else {
        btnIn.className = "mode-btn";
        btnOut.className = "mode-btn active-out";
      }
    }

    function aplicarEvento(nombreLimpio) {
      nombreEventoActivo = nombreLimpio;
      const idNormalizado = nombreLimpio.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "_");
      STORAGE_KEY = "fcad_acreditacion_db_v2::" + idNormalizado;

      localStorage.setItem("fcad_evento_nombre", nombreEventoActivo);
      localStorage.setItem("fcad_evento_key", STORAGE_KEY);

      if (tituloEvento) tituloEvento.innerText = nombreEventoActivo;
      if (subtituloEvento) subtituloEvento.innerText = `⚡ ${nombreEventoActivo}`;
    }

    function confirmarNuevoEvento() {
      const codigo = window.prompt(
        "⚠️ ATENCIÓN: esta acción borra TODOS los datos de acreditación guardados " +
        "en este dispositivo para este evento (padrón cargado, entradas y salidas registradas) y " +
        "NO se puede deshacer.\n\n" +
        "Usalo solo al empezar un evento nuevo, después de haber exportado el CSV " +
        "del evento anterior.\n\n" +
        "Para confirmar que estás seguro, escribí el código 2121:"
      );
      if (codigo === null) return;
      if (codigo.trim() !== "2121") {
        mostrarMensaje("Código incorrecto. No se borró ningún dato.", "alerta");
        return;
      }
      localStorage.removeItem(STORAGE_KEY);
      padron = {};
      actualizarMetricasUI();
      mostrarMensaje("Dispositivo reiniciado para este evento.", "ok");
    }

    function getAudioCtx() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } 
        catch (e) { return null; }
      }
      return audioCtx;
    }

    function playBeep(tipo) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      if (ctx.state === "suspended") ctx.resume();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (tipo === "ok") {
        osc.frequency.setValueAtTime(650, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1100, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.12);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } else {
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        gain.gain.setValueAtTime(0.35, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      }
    }

    function vibrar(patron) {
      if (navigator.vibrate) navigator.vibrate(patron);
    }

    function timestampActual() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function formatoHoraCorta() {
      return new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function sincronizarStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(padron));
      actualizarMetricasUI();
    }

    function actualizarMetricasUI() {
      let inscriptos = 0, presentes = 0, completados = 0;
      for (const dni in padron) {
        inscriptos++;
        if (padron[dni].estadoEntrada === "Presente") presentes++;
        if (padron[dni].estadoSalida === "Completado") completados++;
      }

      const items = [
        ["m-inscriptos", inscriptos],
        ["m-presentes", presentes],
        ["m-salidas", completados]
      ];

      items.forEach(([id, val]) => {
        const el = document.getElementById(id);
        if (el && el.innerText !== String(val)) {
          el.innerText = val;
          el.classList.add("bump");
          setTimeout(() => el.classList.remove("bump"), 300);
        }
      });
    }

    function mostrarMensaje(texto, tipo) {
      box.className = tipo;
      box.innerText = texto;
      if (tipo === "alerta" || tipo === "error") {
        input.classList.add("shake");
        setTimeout(() => input.classList.remove("shake"), 300);
      }
      playBeep(tipo === "ok" ? "ok" : "error");
      vibrar(tipo === "ok" ? 60 : 150);
    }

    function procesar(modo, dniDirecto = null) {
      const dni = (dniDirecto !== null ? String(dniDirecto) : input.value).replace(/\D/g, "").trim();

      if (!dni) {
        mostrarMensaje("Ingresá un número de DNI.", "alerta");
        input.focus();
        return;
      }

      if (dni.length < 6 || dni.length > 8) {
        mostrarMensaje("El DNI debe tener entre 6 y 8 dígitos numéricos.", "alerta");
        return;
      }

      if (!padron[dni]) {
        if (html5QrCode && camaraActiva) {
          try { html5QrCode.pause(); } catch (_) {}
        }
        abrirModalNuevo(dni);
        return;
      }

      const asistente = padron[dni];
      const ahora = timestampActual();

      if (modo === "ENTRADA") {
        if (asistente.estadoEntrada === "Presente") {
          mostrarMensaje(`⚠️ ${asistente.nombre} ya acreditó ingreso (${asistente.horaEntrada}).`, "alerta");
        } else {
          asistente.estadoEntrada = "Presente";
          asistente.horaEntrada = ahora;
          mostrarMensaje(`✅ Ingreso acreditado: ${asistente.nombre}`, "ok");
          ultimoRegistro.innerText = `Último registro: DNI ${dni} · entrada · ${formatoHoraCorta()}`;
        }
      } else if (modo === "SALIDA") {
        if (asistente.estadoEntrada !== "Presente") {
          mostrarMensaje(`❌ Error: ${asistente.nombre} no tiene entrada registrada.`, "error");
          return;
        }
        if (asistente.estadoSalida === "Completado") {
          mostrarMensaje(`⚠️ ${asistente.nombre} ya registró su egreso previamente.`, "alerta");
        } else {
          asistente.estadoSalida = "Completado";
          asistente.horaSalida = ahora;
          mostrarMensaje(`👋 Egreso registrado: ${asistente.nombre}`, "ok");
          ultimoRegistro.innerText = `Último registro: DNI ${dni} · salida · ${formatoHoraCorta()}`;
        }
      }

      sincronizarStorage();
      input.value = "";
      input.focus();
    }

    function abrirModalNuevo(dni) {
      document.getElementById("nuevo-dni").value = dni;
      document.getElementById("nuevo-nombre").value = "";
      document.getElementById("nuevo-email").value = "";
      document.getElementById("nuevo-constancia").value = "No";
      document.getElementById("nuevo-invitaciones").value = "Sí";
      modalNuevo.style.display = "flex";
      document.getElementById("nuevo-nombre").focus();
    }

    function cerrarModal() {
      modalNuevo.style.display = "none";
      input.value = "";
      input.focus();
      if (html5QrCode && camaraActiva) {
        try { html5QrCode.resume(); } catch (_) {}
      }
    }

    function confirmarRegistroPuerta() {
      const dni = document.getElementById("nuevo-dni").value.trim();
      const nombre = document.getElementById("nuevo-nombre").value.trim();
      const email = document.getElementById("nuevo-email").value.trim();
      const constancia = document.getElementById("nuevo-constancia").value;
      const invitaciones = document.getElementById("nuevo-invitaciones").value;

      if (!nombre || !email) {
        alert("Completá Nombre y Correo Electrónico.");
        return;
      }

      const ahora = timestampActual();
      padron[dni] = {
        marcaTemporal: ahora,
        nombre: nombre,
        email: email,
        dni: dni,
        constancia: constancia,
        estadoEntrada: "Presente",
        horaEntrada: ahora,
        estadoSalida: "Pendiente",
        horaSalida: "",
        certificacionEnviada: "No",
        invitaciones: invitaciones
      };

      sincronizarStorage();
      cerrarModal();
      mostrarMensaje(`✅ Registrado e Ingresado: ${nombre}`, "ok");
      ultimoRegistro.innerText = `Último registro: DNI ${dni} · entrada (puerta) · ${formatoHoraCorta()}`;
    }

    // --- ESCANEO CONTINUO CON HTML5-QRCODE ---
    async function toggleCamara() {
      if (camaraActiva) {
        detenerCamara();
      } else {
        iniciarCamara();
      }
    }

    let timerSinCodigo = null;

    async function iniciarCamara() {
      try {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
        }

        readerContainer.style.display = "block";
        document.getElementById("btn-toggle-cam-text").innerText = "Detener Cámara";

        const config = {
          fps: 10,
          qrbox: { width: 220, height: 220 },
          aspectRatio: 1.0
        };

        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          (decodedText) => {
            const dniLimpio = decodedText.replace(/\D/g, "").trim();
            if (!dniLimpio) return;

            // Al ver un código válido, cancela cualquier reseteo pendiente
            if (timerSinCodigo) {
              clearTimeout(timerSinCodigo);
              timerSinCodigo = null;
            }

            // Si el código sigue siendo el mismo DNI frente a la cámara, se ignora por completo
            if (dniLimpio === ultimoDniLeido) return;

            // Nuevo DNI detectado: memoriza y procesa la acreditación
            ultimoDniLeido = dniLimpio;
            procesar(modoActivo, dniLimpio);
          },
          () => {
            // Se ejecuta en los cuadros donde la cámara no detecta ningún QR
            // Si el código ya no está a la vista, espera 2 segundos antes de limpiar la memoria
            if (!timerSinCodigo && ultimoDniLeido !== "") {
              timerSinCodigo = setTimeout(() => {
                ultimoDniLeido = "";
                timerSinCodigo = null;
              }, 2000);
            }
          }
        );

        camaraActiva = true;
      } catch (err) {
        alert("No se pudo iniciar la cámara: " + (err.message || err));
        detenerCamara();
      }
    }

    async function detenerCamara() {
      if (timerSinCodigo) {
        clearTimeout(timerSinCodigo);
        timerSinCodigo = null;
      }
      ultimoDniLeido = "";

      if (html5QrCode && camaraActiva) {
        try {
          await html5QrCode.stop();
        } catch (_) {}
      }
      camaraActiva = false;
      readerContainer.style.display = "none";
      document.getElementById("btn-toggle-cam-text").innerText = "Activar Cámara QR";
      input.focus();
    }

    // Tecla Enter para Pistolas / Lectores USB
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        procesar(modoActivo);
      }
    });

    function parsearLineaCsv(linea) {
      const regex = /(?:,|\n|^)("(?:(?:"")*[^"]*)*"|[^",\n]*|(?:\n|$))/g;
      const valores = [];
      let match;
      while ((match = regex.exec(linea)) !== null) {
        let val = match[1];
        if (val && val.startsWith('"') && val.endsWith('"')) {
          val = val.substring(1, val.length - 1).replace(/""/g, '"');
        }
        valores.push(val ? val.trim() : "");
        if (regex.lastIndex >= linea.length) break;
      }
      return valores;
    }

    function descargarCsvDescartados(descartados) {
      let csv = '"Nombre","DNI original","Motivo"\r\n';
      descartados.forEach(d => {
        const nombre = String(d.nombre).replace(/"/g, '""');
        const dniOriginal = String(d.dniOriginal).replace(/"/g, '""');
        csv += `"${nombre}","${dniOriginal}","No tiene 6 u 8 dígitos"\r\n`;
      });

      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `padron_descartados_${Date.now()}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function cargarPadronCsv(event) {
      const file = event.target.files[0];
      if (!file) return;

      let nombreDetectado = file.name.replace(/\.[^/.]+$/, "");
      nombreDetectado = nombreDetectado
        .replace(/\s*-\s*Respuestas de formularios?(\s*\d+)?/i, "")
        .replace(/\s*-\s*Respuestas de hojas de cálculo(\s*\d+)?/i, "")
        .replace(/^(padron|asistencia|inscriptos)[_-]/i, "")
        .trim();

      if (!nombreDetectado) nombreDetectado = "Evento General";

      aplicarEvento(nombreDetectado);

      const backup = localStorage.getItem(STORAGE_KEY);
      padron = backup ? JSON.parse(backup) : {};

      const reader = new FileReader();
      reader.onload = function(e) {
        const lineas = e.target.result.split(/\r\n|\n/);
        let incorporados = 0;
        let descartados = [];

        for (let i = 1; i < lineas.length; i++) {
          if (!lineas[i].trim()) continue;
          const cols = parsearLineaCsv(lineas[i]);
          
          const marcaTemporal = cols[0] || "";
          const nombre = cols[1] || "";
          const email = cols[2] || "";
          const dniOriginal = cols[3] || "";
          const dni = String(dniOriginal).replace(/\D/g, "");
          const constancia = cols[4] || "No";
          const estEntrada = cols[5] || "Pendiente";
          const hrEntrada = cols[6] || "";
          const estSalida = cols[7] || "Pendiente";
          const hrSalida = cols[8] || "";
          const certEnviada = cols[9] || "No";
          const invitaciones = cols[10] || "Sí";

          if (dni.length < 6 || dni.length > 8) {
            if (dniOriginal || nombre) {
              descartados.push({ nombre: nombre || "(sin nombre)", dniOriginal: dniOriginal || "(vacío)" });
            }
            continue;
          }

          if (!padron[dni]) {
            padron[dni] = {
              marcaTemporal: marcaTemporal,
              nombre: nombre,
              email: email,
              dni: dni,
              constancia: constancia,
              estadoEntrada: estEntrada,
              horaEntrada: hrEntrada,
              estadoSalida: estSalida,
              horaSalida: hrSalida,
              certificacionEnviada: certEnviada,
              invitaciones: invitaciones
            };
            incorporados++;
          }
        }
        sincronizarStorage();

        if (descartados.length > 0) {
          descargarCsvDescartados(descartados);
          mostrarMensaje(
            `Padrón cargado (${nombreEventoActivo}): ${incorporados} agregados. ⚠️ ${descartados.length} descartado(s) por DNI inválido.`,
            "alerta"
          );
        } else {
          mostrarMensaje(`Padrón cargado (${nombreEventoActivo}): ${incorporados} inscriptos agregados.`, "ok");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    function exportarCsvAsistencia() {
      const encabezados = [
        "Marca temporal",
        "Nombre completo (Nombre y Apellido)",
        "Correo Electrónico",
        "DNI",
        "¿Necesita una constancia de asistencia para el trabajo/estudio?",
        "Estado Entrada",
        "Hora Entrada",
        "Estado Salida",
        "Hora Salida",
        "Certificación Enviada",
        "¿Desea recibir invitaciones a futuros eventos?"
      ];

      let csv = encabezados.map(h => `"${h}"`).join(",") + "\r\n";

      for (const dni in padron) {
        const a = padron[dni];
        const fila = [
          a.marcaTemporal || timestampActual(),
          String(a.nombre).replace(/"/g, '""'),
          String(a.email).replace(/"/g, '""'),
          a.dni,
          a.constancia || "No",
          a.estadoEntrada || "Pendiente",
          a.horaEntrada || "",
          a.estadoSalida || "Pendiente",
          a.horaSalida || "",
          a.certificacionEnviada || "No",
          a.invitaciones || "Sí"
        ];
        csv += fila.map(v => `"${v}"`).join(",") + "\r\n";
      }
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      
      const idSaneado = nombreEventoActivo.toLowerCase().replace(/[^a-z0-9_-]/g, "_");
      link.download = `asistencia_mesa_${idSaneado}_${Date.now()}.csv`;
      
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    window.onload = () => {
      if (localStorage.getItem("fcad_evento_nombre")) {
        aplicarEvento(localStorage.getItem("fcad_evento_nombre"));
      }
      const backup = localStorage.getItem(STORAGE_KEY);
      if (backup) {
        try { padron = JSON.parse(backup); } catch (_) { padron = {}; }
      }
      actualizarMetricasUI();
      input.focus();
    };
  </script>
